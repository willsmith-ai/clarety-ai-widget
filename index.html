<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarety AI</title>
<style>
  /* --- 1. The Chat Bubble Button --- */
  .chat-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    
    /* Your original branding colors */
    background-color: #426EAC; 
    color: white;
    
    /* Icon styling */
    font-size: 30px;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    z-index: 9999;
    
    /* Centering the icon */
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .chat-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
  }

  /* --- 2. The Chat Window (Hidden by default) --- */
  .chat-window {
    display: none; /* Hidden initially */
    position: fixed;
    bottom: 110px; /* Above the button */
    right: 24px;
    width: 350px;
    height: 500px;
    max-height: 80vh; 
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    flex-direction: column;
    z-index: 9999;
    font-family: Arial, sans-serif;
    border: 1px solid #e5e7eb;
    overflow: hidden;
  }

  /* Header */
  .chat-header {
    background: #426EAC; /* Matches your button */
    color: white;
    padding: 15px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .close-btn { cursor: pointer; font-size: 1.2rem; opacity: 0.8; }
  .close-btn:hover { opacity: 1; }

  /* Messages Area */
  .chat-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f9f9f9;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Message Bubbles */
  .message { padding: 10px 14px; border-radius: 15px; max-width: 85%; line-height: 1.4; font-size: 14px; }
  .user { background: #426EAC; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
  .bot { background: #e0e0e0; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }

  /* Input Area */
  .chat-input-area {
    display: flex;
    border-top: 1px solid #ddd;
    padding: 12px;
    background: white;
  }
  #userInput { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
  button.send { margin-left: 10px; padding: 10px 20px; background: #426EAC; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
  button.send:hover { background: #35588a; }
</style>
</head>
<body>

  <h1>Clarety Core AI</h1>
  <p>This is a test page.</p>

  <button class="chat-btn" onclick="toggleChat()">💬</button>

  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <span>Clarety Helper</span>
      <span class="close-btn" onclick="toggleChat()">✕</span>
    </div>
    <div class="chat-messages" id="messages">
      <div class="message bot">Hello! Ask me anything about our community.</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="Type a question..." onkeypress="handleEnter(event)">
      <button class="send" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // I added your actual Render URL here automatically:
    const BACKEND_URL = "https://claretycoreapi.onrender.com/chat"; 

    function toggleChat() {
      const window = document.getElementById('chatWindow');
      if (window.style.display === 'flex') {
        window.style.display = 'none';
      } else {
        window.style.display = 'flex';
        setTimeout(() => document.getElementById('userInput').focus(), 100);
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      // 1. Show User Message
      addMessage(text, 'user');
      input.value = '';

      // 2. Show "Thinking..."
      const loadingId = addMessage("Thinking...", 'bot');

      // 3. Send to Your Render Backend
      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: text })
        });

        if (!response.ok) throw new Error("Network response was not ok");

        const data = await response.json();
        
        // 4. Update with real answer
        const botMsgDiv = document.getElementById(loadingId);
        botMsgDiv.innerText = data.answer;
        
        // Show links if any
        if(data.links && data.links.length > 0) {
          const linkList = document.createElement('div');
          linkList.style.marginTop = "10px";
          linkList.style.fontSize = "12px";
          linkList.innerHTML = "<b>Sources:</b><br>";
          data.links.forEach(l => {
              const a = document.createElement('a');
              a.href = l.url;
              a.target = "_blank";
              a.innerText = l.title;
              a.style.display = "block";
              a.style.color = "#426EAC";
              linkList.appendChild(a);
          });
          botMsgDiv.appendChild(linkList);
        }

      } catch (error) {
        console.error(error);
        document.getElementById(loadingId).innerText = "I'm waking up! Please try again in 30 seconds.";
      }
    }

    function addMessage(text, sender) {
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.innerText = text;
      const id = 'msg-' + Date.now();
      div.id = id;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return id;
    }
  </script>

</body>
</html>
