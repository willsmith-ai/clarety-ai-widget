<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarety Core AI</title>

  <style>
    /* Basic page styling (kept minimal so it doesn't fight the widget) */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
    }

    /* ================= Clarety Popup Widget ================= */
    #clarety-chat {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #clarety-launcher {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #81A638; /* Clarety Green */
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
      display: grid;
      place-items: center;
      padding: 0;
    }

    #clarety-launcher img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      display: block;
    }

    #clarety-panel {
      display: none;
      width: 360px;
      height: 520px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      position: absolute;
      bottom: 70px;
      right: 0;
      overflow: hidden;
      flex-direction: column;
      border: 1px solid rgba(0,0,0,0.06);
    }

    #clarety-panel.open {
      display: flex;
    }

    #clarety-header {
      background: #426EAC; /* Clarety Blue */
      color: white;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    #clarety-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    #clarety-header-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
      background: rgba(255,255,255,0.92);
      border-radius: 8px;
      padding: 4px;
    }

    #clarety-title {
      font-weight: 700;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #clarety-close {
      border: 0;
      background: rgba(255,255,255,0.18);
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      line-height: 34px;
    }

    #clarety-close:hover {
      background: rgba(255,255,255,0.28);
    }

    #messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      background:
        radial-gradient(circle at 12% 10%, rgba(232,185,9,.10), transparent 40%),
        radial-gradient(circle at 90% 20%, rgba(221,118,28,.10), transparent 42%),
        #fff;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.35;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message.user {
      background: #426EAC; /* Clarety Blue */
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 6px;
    }

    .message.bot {
      background: #e9ecef;
      color: #0f172a;
      border-bottom-left-radius: 6px;
    }

    .chat-input-area {
      padding: 12px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
      background: #fff;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 18px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 14px;
    }

    .chat-input-area button {
      background: #81A638; /* Clarety Green */
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .chat-input-area button:hover {
      filter: brightness(0.95);
    }

    .doc-link {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      color: #426EAC;
      text-decoration: none;
      background: rgba(66,110,172,0.10);
      padding: 6px 10px;
      border-radius: 10px;
    }

    .doc-link:hover {
      background: rgba(66,110,172,0.16);
    }
  </style>
</head>

<body>
  <!-- Bottom-right Clarety Chat Widget -->
  <div id="clarety-chat">
    <button id="clarety-launcher" aria-label="Open Clarety Assistant" type="button">
      <!-- IMPORTANT: ensure this file exists in /assets with EXACT casing -->
      <img src="assets/ClaretyAIimage.png" alt="Clarety" />
    </button>

    <div id="clarety-panel" role="dialog" aria-label="Clarety Assistant">
      <div id="clarety-header">
        <div id="clarety-brand">
          <img id="clarety-header-logo" src="assets/ClaretyAIimage.png" alt="Clarety" />
          <div id="clarety-title">Clarety Assistant</div>
        </div>
        <button id="clarety-close" aria-label="Close chat" type="button">✕</button>
      </div>

      <div id="messages">
        <div class="message bot">Hi 👋 I’m the Clarety Assistant. How can I help today?</div>
      </div>

      <div class="chat-input-area">
        <input
          type="text"
          id="userInput"
          placeholder="Type a message…"
          autocomplete="off"
        />
        <button id="sendBtn" type="button">Send</button>
      </div>
    </div>
  </div>

  <script>
    // Your Render chat endpoint
    const API_URL = "https://claretycoreapi.onrender.com/chat";
    let isProcessing = false;

    const launcher = document.getElementById("clarety-launcher");
    const panel = document.getElementById("clarety-panel");
    const closeBtn = document.getElementById("clarety-close");
    const sendBtn = document.getElementById("sendBtn");
    const inputField = document.getElementById("userInput");

    launcher.onclick = () => panel.classList.toggle("open");
    closeBtn.onclick = () => panel.classList.remove("open");

    // Enter-to-send (only when the panel is open)
    inputField.addEventListener("keypress", (event) => {
      if (event.key === "Enter") sendMessage();
    });

    sendBtn.addEventListener("click", sendMessage);

    async function sendMessage() {
      if (isProcessing) return;

      const message = inputField.value.trim();
      if (!message) return;

      // Auto-open panel if user somehow types before opening
      panel.classList.add("open");

      isProcessing = true;
      addMessage(message, "user");
      inputField.value = "";

      const loadingId = addMessage("Thinking…", "bot");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: message })
        });

        const data = await response.json();

        document.getElementById(loadingId)?.remove();

        addMessage(data.answer || "Sorry — I didn’t get an answer back.", "bot");

        if (data.links && data.links.length > 0) {
          const messagesDiv = document.getElementById("messages");
          const lastMsg = messagesDiv.lastElementChild;

          data.links.forEach(link => {
            const a = document.createElement("a");
            a.href = link.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.className = "doc-link";
            a.innerText = "📄 " + link.title;
            lastMsg.appendChild(a);
          });
        }

      } catch (err) {
        console.error("Chat error:", err);
        const loadingMsg = document.getElementById(loadingId);
        if (loadingMsg) loadingMsg.innerText = "Sorry — I couldn't connect to the server.";
      } finally {
        isProcessing = false;
      }
    }

    function addMessage(text, sender) {
      const messagesDiv = document.getElementById("messages");
      const div = document.createElement("div");
      div.className = `message ${sender}`;
      div.id = "msg-" + Date.now();
      div.innerText = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
      return div.id;
    }
  </script>
</body>
</html>
