<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarety Core AI</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
    }

    #clarety-chat {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
    }

    #clarety-launcher {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #81A638;
      background: #fff;
      cursor: pointer;
      box-shadow:
        0 10px 22px rgba(0,0,0,.22),
        0 0 0 6px rgba(129,166,56,.15);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    #clarety-launcher img {
      width: 92%;
      height: 92%;
      object-fit: contain;
    }

    #clarety-panel {
      display: none;
      width: 360px;
      height: 520px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      position: absolute;
      bottom: 70px;
      right: 0;
      overflow: hidden;
      flex-direction: column;
    }

    #clarety-panel.open { display: flex; }

    #clarety-header {
      background: #426EAC;
      color: #fff;
      padding: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
    }

    #clarety-close {
      border: 0;
      background: rgba(255,255,255,0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
    }

    #messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
    }

    .message {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.35;
      white-space: pre-wrap;
    }

    .message.user {
      background: #426EAC;
      color: #fff;
      margin-left: auto;
    }

    .message.bot {
      background: #e9ecef;
      color: #111;
    }

    .chat-input-area {
      padding: 12px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid #ddd;
      outline: none;
    }

    .chat-input-area button {
      background: #81A638;
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 18px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="clarety-chat">
  <button id="clarety-launcher">
    <img src="assets/ClaretyAIimage.png" alt="Clarety" />
  </button>

  <div id="clarety-panel">
    <div id="clarety-header">
      Clarety Assistant
      <button id="clarety-close">×</button>
    </div>

    <div id="messages">
      <div class="message bot">
        Hi 👋 I’m the Clarety Assistant.  
        I can answer Clarety questions, help draft emails, or talk through ideas.
      </div>
    </div>

    <div class="chat-input-area">
      <input id="userInput" placeholder="Type a message…" />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://claretycoreapi.onrender.com/chat";
  let isProcessing = false;

  const panel = document.getElementById("clarety-panel");
  document.getElementById("clarety-launcher").onclick = () => panel.classList.toggle("open");
  document.getElementById("clarety-close").onclick = () => panel.classList.remove("open");
  document.getElementById("sendBtn").onclick = sendMessage;
  document.getElementById("userInput").addEventListener("keypress", e => e.key === "Enter" && sendMessage());

  function addMessage(text, sender) {
    const div = document.createElement("div");
    div.className = `message ${sender}`;
    div.innerText = text;
    document.getElementById("messages").appendChild(div);
    div.scrollIntoView({ behavior: "smooth" });
  }

  function isRagFailure(text = "") {
    const t = text.toLowerCase();
    return (
      t.includes("no documents found") ||
      t.includes("cannot assist") ||
      t.includes("do not contain information") ||
      t.includes("try a more specific") ||
      t.trim().length < 20
    );
  }

  function generativeFallback(userMessage) {
    return (
`I can still help 👍

It sounds like you’re looking for guidance rather than a specific Clarety document.

Let’s start with one question:
What are you trying to achieve?

For example:
• website or design advice
• planning or strategy
• drafting or rewriting content
• understanding a process

Tell me a bit more and I’ll help from there.`
    );
  }

  async function sendMessage() {
    if (isProcessing) return;

    const input = document.getElementById("userInput");
    const userText = input.value.trim();
    if (!userText) return;

    panel.classList.add("open");
    addMessage(userText, "user");
    input.value = "";

    isProcessing = true;
    addMessage("Thinking…", "bot");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: userText })
      });

      const data = await res.json();
      const botAnswer = data?.answer || "";

      // Remove last "Thinking…"
      const msgs = document.querySelectorAll(".message.bot");
      msgs[msgs.length - 1]?.remove();

      if (isRagFailure(botAnswer)) {
        addMessage(generativeFallback(userText), "bot");
      } else {
        addMessage(botAnswer, "bot");
      }

    } catch {
      addMessage(
        "I had trouble reaching the server — but I can still help. What are you trying to do?",
        "bot"
      );
    } finally {
      isProcessing = false;
    }
  }
</script>

</body>
</html>
