<!-- Widget Launcher -->
<button id="clarety-launcher" aria-label="Open Clarety Assistant">
  <img src="assets/clarety-core-ai-logo.png" alt="Clarety Core AI" />
</button>

<!-- Widget Panel -->
<div id="clarety-widget" class="hidden" role="dialog" aria-label="Clarety Assistant">
  <div class="cw-header">
    <div class="cw-title">Clarety Assistant</div>
    <button id="cw-close" class="cw-close" aria-label="Close">×</button>
  </div>

  <div id="cw-messages" class="cw-messages"></div>

  <div class="cw-footer">
    <!-- Attach button -->
    <div class="attach-wrap" aria-label="Attach image">
      <button type="button" id="attachBtn" class="attach-btn" aria-label="Attach image">
        <!-- crisp clip svg -->
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M9 17l6.5-6.5a3 3 0 10-4.2-4.2L6.8 10.8a5 5 0 107.1 7.1L19 12.8"
            stroke="white" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- IMPORTANT: input is centered OVER the visible button -->
      <input id="attachInput" type="file" accept="image/*" />
    </div>

    <input id="cw-input" class="cw-input" placeholder="Type a message..." />
    <button id="cw-send" class="cw-send">Send</button>
  </div>
</div>

<script>
  // ---------------- State ----------------
  let selectedImage = null; // { dataUrl, name, type }

  const launcher = document.getElementById("clarety-launcher");
  const widget = document.getElementById("clarety-widget");
  const closeBtn = document.getElementById("cw-close");
  const messagesEl = document.getElementById("cw-messages");
  const inputEl = document.getElementById("cw-input");
  const sendBtn = document.getElementById("cw-send");

  const attachInput = document.getElementById("attachInput");

  // ---------------- Open/Close ----------------
  launcher.addEventListener("click", () => widget.classList.remove("hidden"));
  closeBtn.addEventListener("click", () => widget.classList.add("hidden"));

  // ---------------- Attach handling ----------------
  attachInput.addEventListener("change", handleFileSelected);

  function handleFileSelected(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    // limit (keep it sane for base64 + API)
    const maxMb = 4;
    if (file.size > maxMb * 1024 * 1024) {
      addBotMessage(`That image is a bit large. Please upload something under ${maxMb}MB.`);
      attachInput.value = "";
      return;
    }

    const reader = new FileReader();
    reader.onload = () => {
      selectedImage = {
        dataUrl: reader.result, // "data:image/png;base64,..."
        name: file.name,
        type: file.type
      };

      // show preview bubble in chat immediately (like before)
      renderImagePreviewBubble(selectedImage.dataUrl);
    };
    reader.readAsDataURL(file);
  }

  function renderImagePreviewBubble(dataUrl) {
    const wrap = document.createElement("div");
    wrap.className = "cw-msg cw-msg-user";

    const img = document.createElement("img");
    img.src = dataUrl;
    img.alt = "Uploaded preview";
    img.className = "cw-upload-preview";

    wrap.appendChild(img);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  // ---------------- Chat send ----------------
  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  function addUserMessage(text) {
    const el = document.createElement("div");
    el.className = "cw-msg cw-msg-user";
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addBotMessage(text) {
    const el = document.createElement("div");
    el.className = "cw-msg cw-msg-bot";
    el.textContent = text;
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function sendMessage() {
    const text = (inputEl.value || "").trim();
    if (!text && !selectedImage) return;

    if (text) addUserMessage(text);
    inputEl.value = "";

    try {
      const payload = {
        query: text || "(image)",
        imageDataUrl: selectedImage ? selectedImage.dataUrl : null
      };

      // clear selection AFTER it’s included in payload
      selectedImage = null;
      attachInput.value = "";

      const r = await fetch("https://YOUR-RENDER-URL.onrender.com/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      const json = await r.json();
      addBotMessage(json.answer || "No response.");
    } catch (err) {
      addBotMessage("Something went wrong sending your message.");
      console.error(err);
    }
  }
</script>

<style>
  /* Launcher */
  #clarety-launcher{
    position:fixed; right:24px; bottom:24px;
    width:120px; height:120px; border-radius:999px;
    border:none; background:transparent; cursor:pointer;
    padding:0; z-index:9999;
  }
  #clarety-launcher img{
    width:96%; height:96%;
    object-fit:contain; border-radius:999px;
    display:block; margin:auto;
  }
  /* thinner pulse ring */
  #clarety-launcher::before{
    content:"";
    position:absolute;
    inset:-8px;                 /* how far ring sits out */
    border-radius:999px;
    border:7px solid rgba(129,166,56,0.45);  /* THICKNESS */
    animation:pulse 1.6s infinite;
    pointer-events:none;
  }
  @keyframes pulse{
    0%{ transform:scale(1); opacity:.9; }
    70%{ transform:scale(1.06); opacity:.25; }
    100%{ transform:scale(1.08); opacity:0; }
  }

  /* Widget */
  #clarety-widget{
    position:fixed; right:24px; bottom:160px;
    width:520px; max-width:calc(100vw - 32px);
    height:620px; max-height:calc(100vh - 220px);
    background:#fff; border-radius:26px;
    box-shadow:0 16px 50px rgba(0,0,0,.25);
    overflow:hidden; z-index:9999;
    display:flex; flex-direction:column;
    font-family: Arial, Helvetica, sans-serif;
  }
  #clarety-widget.hidden{ display:none; }

  .cw-header{
    background:#426EAC;
    color:#fff;
    padding:22px 22px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .cw-title{ font-size:38px; font-weight:800; letter-spacing:.2px; }
  .cw-close{
    width:64px; height:64px; border-radius:18px;
    border:none; background:rgba(255,255,255,.18);
    color:#fff; font-size:44px; cursor:pointer;
    line-height:1;
  }

  .cw-messages{
    flex:1;
    padding:18px;
    overflow:auto;
    background:#ffffff;
  }

  .cw-msg{
    max-width:82%;
    margin:10px 0;
    padding:14px 16px;
    border-radius:18px;
    font-size:18px;
    line-height:1.35;
  }
  .cw-msg-user{
    margin-left:auto;
    background:#426EAC;
    color:#fff;
  }
  .cw-msg-bot{
    margin-right:auto;
    background:#EEF1F4;
    color:#0f172a;
  }

  /* actual image preview bubble */
  .cw-upload-preview{
    display:block;
    width:240px;
    max-width:100%;
    height:auto;
    border-radius:16px;
    box-shadow:0 6px 18px rgba(0,0,0,.18);
  }

  .cw-footer{
    display:flex;
    gap:14px;
    align-items:center;
    padding:18px;
    background:#fff;
    border-top:1px solid #e6e6e6;
  }

  .cw-input{
    flex:1;
    height:64px;
    border-radius:28px;
    border:2px solid #d0d0d0;
    padding:0 18px;
    font-size:20px;
    outline:none;
  }

  .cw-send{
    height:78px;
    width:140px;
    border-radius:34px;
    border:none;
    background:#81A638;
    color:#fff;
    font-size:26px;
    font-weight:800;
    cursor:pointer;
  }

  .attach-wrap{
    position:relative;
    width:78px; height:78px;
    flex:0 0 auto;
  }
  .attach-btn{
    width:78px; height:78px;
    border-radius:999px;
    border:none;
    background:#81A638;
    display:grid;
    place-items:center;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(0,0,0,.18);
  }

  /* KEY: invisible file input centered EXACTLY over visible button */
  .attach-wrap input[type="file"]{
    position:absolute;
    top:50%; left:50%;
    width:78px; height:78px;
    transform:translate(-50%,-50%);
    opacity:0;
    cursor:pointer;
    z-index:5;
  }

  @media (max-width: 520px){
    #clarety-widget{
      right:12px; bottom:140px;
      width:calc(100vw - 24px);
      height:min(620px, calc(100vh - 180px));
    }
    .cw-title{ font-size:32px; }
  }
</style>
