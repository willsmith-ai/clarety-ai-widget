<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarety Core AI</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
    }

    /* ================= Clarety Popup Widget ================= */
    #clarety-chat {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
    }

    #clarety-launcher {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: none;
      background: #81A638;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(0,0,0,.25);
      display: grid;
      place-items: center;
      padding: 0; /* IMPORTANT: remove padding */
      overflow: hidden;
    }

    /* LOGO FILLS THE ENTIRE BUBBLE */
    #clarety-launcher img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      display: block;
    }

    #clarety-panel {
      display: none;
      width: 360px;
      height: 520px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      position: absolute;
      bottom: 70px;
      right: 0;
      overflow: hidden;
      flex-direction: column;
    }

    #clarety-panel.open {
      display: flex;
    }

    #clarety-header {
      background: #426EAC;
      color: white;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #clarety-header strong {
      font-size: 14px;
    }

    #clarety-close {
      border: 0;
      background: rgba(255,255,255,0.2);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      cursor: pointer;
    }

    #messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      background: #426EAC;
      color: white;
      margin-left: auto;
    }

    .message.bot {
      background: #e9ecef;
      color: #111;
    }

    .chat-input-area {
      padding: 12px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 10px 12px;
      border-radius: 18px;
      border: 1px solid #ddd;
      outline: none;
    }

    .chat-input-area button {
      background: #81A638;
      color: white;
      border: none;
      padding: 0 16px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 700;
    }

    .doc-link {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      color: #426EAC;
      text-decoration: none;
      background: rgba(66,110,172,0.12);
      padding: 6px 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div id="clarety-chat">
  <button id="clarety-launcher">
    <img src="assets/ClaretyAIimage.png" alt="Clarety" />
  </button>

  <div id="clarety-panel">
    <div id="clarety-header">
      <strong>Clarety Assistant</strong>
      <button id="clarety-close">✕</button>
    </div>

    <div id="messages">
      <div class="message bot">
        Hi 👋 I’m the Clarety Assistant. How can I help today?
      </div>
    </div>

    <div class="chat-input-area">
      <input
        id="userInput"
        type="text"
        placeholder="Type a message…"
        autocomplete="off"
      />
      <button id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://claretycoreapi.onrender.com/chat";
  let isProcessing = false;

  const launcher = document.getElementById("clarety-launcher");
  const panel = document.getElementById("clarety-panel");
  const closeBtn = document.getElementById("clarety-close");
  const sendBtn = document.getElementById("sendBtn");
  const inputField = document.getElementById("userInput");

  launcher.onclick = () => panel.classList.toggle("open");
  closeBtn.onclick = () => panel.classList.remove("open");

  inputField.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
  sendBtn.onclick = sendMessage;

  async function sendMessage() {
    if (isProcessing) return;

    const message = inputField.value.trim();
    if (!message) return;

    panel.classList.add("open");
    isProcessing = true;

    addMessage(message, "user");
    inputField.value = "";

    const loadingId = addMessage("Thinking…", "bot");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: message })
      });

      const raw = await res.text();
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${raw}`);

      const data = JSON.parse(raw);

      document.getElementById(loadingId)?.remove();
      addMessage(data.answer || "No answer returned.", "bot");

      if (data.links && data.links.length > 0) {
        const lastMsg = document.getElementById("messages").lastElementChild;
        data.links.forEach(link => {
          const a = document.createElement("a");
          a.href = link.url;
          a.target = "_blank";
          a.className = "doc-link";
          a.innerText = "📄 " + link.title;
          lastMsg.appendChild(a);
        });
      }

    } catch (err) {
      console.error(err);
      const loadingMsg = document.getElementById(loadingId);
      if (loadingMsg) loadingMsg.innerText = "Error: " + err.message;
    } finally {
      isProcessing = false;
    }
  }

  function addMessage(text, sender) {
    const messagesDiv = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `message ${sender}`;
    div.id = "msg-" + Date.now();
    div.innerText = text;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return div.id;
  }
</script>

</body>
</html>
