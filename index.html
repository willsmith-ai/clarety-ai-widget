<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Clarety AI</title>

  <style>
    .clarety-ai-button {
      position: fixed;
      bottom: 24px;
      right: 24px;

      width: 54px;
      height: 54px;
      border-radius: 50%;

      background-color: #426EAC;
      background-image: url("assets/ClaretyAIimage.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: 90% 90%;

      border: none;
      cursor: pointer;

      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      z-index: 9999;

      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .clarety-ai-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }

    .clarety-ai-button::after {
      content: "Ask Clarety AI";
      position: absolute;
      right: 68px;
      white-space: nowrap;

      background: #1f2937;
      color: white;
      padding: 6px 10px;
      border-radius: 6px;

      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .clarety-ai-button:hover::after {
      opacity: 1;
    }

    .clarety-helper {
      position: fixed;
      bottom: 96px;
      right: 24px;

      background: white;
      color: #1f2937;

      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;

      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
      z-index: 9998;
      max-width: 220px;

      opacity: 0;
      transform: translateY(8px);
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    @media (max-width: 768px) {
      .clarety-ai-button {
        bottom: 16px;
        right: 16px;
      }

      .clarety-helper {
        bottom: 88px;
        right: 16px;
        max-width: 260px;
      }
    }
  </style>
</head>

<body>

  <h1>Clarety Core AI</h1>
  <p>This is a test page.</p>

  <!-- Google Gen Search Widget (Google-managed popup) -->
  <gen-search-widget
    configId="daf2c9fb-1be8-420d-a2b0-76dffee56612"
    triggerId="clarety-ai-trigger">
  </gen-search-widget>

  <div class="clarety-helper">
    Have a question? <strong>Ask Clarety AI</strong>
  </div>

  <button
    id="clarety-ai-trigger"
    class="clarety-ai-button"
    aria-label="Ask Clarety AI">
  </button>

  <script src="https://cloud.google.com/ai/gen-app-builder/client?hl=en_US"></script>

  <script>
    // Show helper after delay
    setTimeout(() => {
      const helper = document.querySelector('.clarety-helper');
      if (helper) {
        helper.style.opacity = '1';
        helper.style.transform = 'translateY(0)';
      }
    }, 1200);

    // Hide helper once AI is opened
    const trigger = document.getElementById('clarety-ai-trigger');
    const helper = document.querySelector('.clarety-helper');

    if (trigger && helper) {
      trigger.addEventListener('click', () => {
        helper.style.opacity = '0';
        helper.style.transform = 'translateY(8px)';
      });
    }
  </script>

</body>
</html>
