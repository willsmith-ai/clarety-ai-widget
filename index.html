<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarety Care (Mock) + Clarety Assistant Widget</title>

  <style>
    :root{
      --clarety-green:#81A638;
      --clarety-blue:#426EAC;
      --clarety-yellow:#E8B909;
      --clarety-orange:#DD761C;
      --text:#0f172a;
      --panel-bg:#ffffff;
      --bubble-bot:#eef2f6;
      --bubble-user:#426EAC;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);
      background:#fff;
    }

    /* ---------- Widget ---------- */
    #clarety-chat{
      position:fixed;
      right:22px;
      bottom:22px;
      z-index:9999;
    }

    #clarety-launcher{
      width:84px;
      height:84px;
      border-radius:50%;
      border:none;
      background:var(--clarety-green);
      cursor:pointer;
      box-shadow:0 16px 36px rgba(0,0,0,.28);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    #clarety-launcher img{
      width:96%;
      height:96%;
      border-radius:50%;
      background:#fff;
      padding:6px;
    }

    #clarety-panel{
      display:none;
      width:520px;
      height:640px;
      background:#fff;
      border-radius:26px;
      box-shadow:0 28px 70px rgba(0,0,0,.28);
      position:absolute;
      bottom:100px;
      right:0;
      overflow:hidden;
      flex-direction:column;
    }
    #clarety-panel.open{ display:flex; }

    #clarety-header{
      background:var(--clarety-blue);
      color:#fff;
      padding:16px 18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-weight:900;
      font-size:24px;
    }

    #clarety-close{
      border:none;
      background:rgba(255,255,255,.2);
      color:#fff;
      font-size:24px;
      cursor:pointer;
      border-radius:10px;
      padding:6px 10px;
    }

    #messages{
      flex:1;
      padding:18px;
      overflow-y:auto;
    }

    .message{
      max-width:88%;
      padding:12px 14px;
      border-radius:18px;
      margin-bottom:12px;
      font-size:16px;
      white-space:pre-wrap;
    }

    .message.user{
      background:var(--bubble-user);
      color:#fff;
      margin-left:auto;
    }

    .message.bot{
      background:var(--bubble-bot);
      color:#0f172a;
    }

    .chat-input-area{
      padding:14px;
      border-top:1px solid rgba(0,0,0,.08);
      display:flex;
      gap:12px;
      align-items:center;
      position:relative;
    }

    .attach-wrap{
      position:relative;
      width:56px;
      height:56px;
    }

    .attach-wrap input{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
    }

    .attach-btn{
      width:56px;
      height:56px;
      border-radius:50%;
      background:var(--clarety-green);
      display:flex;
      align-items:center;
      justify-content:center;
      color:#fff;
      font-size:22px;
    }

    input[type="text"]{
      flex:1;
      border:2px solid rgba(0,0,0,.18);
      border-radius:999px;
      padding:12px 16px;
      font-size:16px;
      outline:none;
    }

    button.send{
      background:var(--clarety-green);
      color:#fff;
      border:none;
      padding:0 22px;
      height:56px;
      border-radius:999px;
      font-weight:700;
      cursor:pointer;
    }

    /* Image preview */
    .image-preview{
      display:none;
      position:absolute;
      left:14px;
      bottom:78px;
      background:#fff;
      border-radius:14px;
      padding:10px;
      box-shadow:0 18px 34px rgba(0,0,0,.18);
      align-items:center;
      gap:10px;
    }
    .image-preview.show{ display:flex; }
    .image-preview img{
      width:56px;
      height:56px;
      border-radius:12px;
      object-fit:cover;
    }
  </style>
</head>

<body>

<div id="clarety-chat">
  <button id="clarety-launcher">
    <img src="assets/ClaretyAIimage.png" alt="Clarety AI" />
  </button>

  <div id="clarety-panel">
    <div id="clarety-header">
      Clarety Assistant
      <button id="clarety-close">✕</button>
    </div>

    <div id="messages">
      <div class="message bot">
        Hi 👋 I’m the Clarety Assistant. Ask a Clarety question, or say “draft an email…” and I’ll help.
      </div>
    </div>

    <div class="chat-input-area">
      <div id="imagePreview" class="image-preview">
        <img id="imagePreviewImg" />
        <button id="removeImage">✕</button>
      </div>

      <div class="attach-wrap">
        <div class="attach-btn">📎</div>
        <input id="imageInput" type="file" accept="image/*" />
      </div>

      <input id="userInput" type="text" placeholder="Type a message…" />
      <button class="send" onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://claretycoreapi.onrender.com/chat";

  const launcher = document.getElementById("clarety-launcher");
  const panel = document.getElementById("clarety-panel");
  const closeBtn = document.getElementById("clarety-close");

  launcher.onclick = () => panel.classList.toggle("open");
  closeBtn.onclick = () => panel.classList.remove("open");

  const imageInput = document.getElementById("imageInput");
  const preview = document.getElementById("imagePreview");
  const previewImg = document.getElementById("imagePreviewImg");
  const removeImage = document.getElementById("removeImage");

  let selectedImage = null;

  imageInput.addEventListener("change", () => {
    selectedImage = imageInput.files[0];
    if (!selectedImage) return;
    previewImg.src = URL.createObjectURL(selectedImage);
    preview.classList.add("show");
  });

  removeImage.onclick = () => {
    selectedImage = null;
    imageInput.value = "";
    preview.classList.remove("show");
  };

  function addMessage(text, sender){
    const div = document.createElement("div");
    div.className = `message ${sender}`;
    div.innerText = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function fileToBase64(file){
    return new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  async function sendMessage(){
    const input = document.getElementById("userInput");
    const text = input.value.trim();
    if (!text && !selectedImage) return;

    if (selectedImage) addMessage(`[Image attached: ${selectedImage.name}]`, "user");
    if (text) addMessage(text, "user");

    input.value = "";

    let imagePayload = null;
    let mimeType = null;

    if (selectedImage){
      const dataUrl = await fileToBase64(selectedImage);
      imagePayload = dataUrl.split(",")[1];
      mimeType = selectedImage.type || "image/png";
      selectedImage = null;
      preview.classList.remove("show");
    }

    addMessage("Thinking…", "bot");

    const res = await fetch(API_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({
        query: text || "Describe this image",
        image: imagePayload,
        mimeType
      })
    });

    const data = await res.json();
    messages.lastChild.remove();
    addMessage(data.answer || "Sorry — no response.", "bot");
  }
</script>

</body>
</html>
