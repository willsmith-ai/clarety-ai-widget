<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clarety AI</title>
<style>
  .chat-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background-color: #426EAC; 
    color: white;
    font-size: 30px;
    border: none;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .chat-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(0,0,0,0.3); }

  .chat-window {
    display: none; 
    position: fixed;
    bottom: 110px; 
    right: 24px;
    width: 350px;
    height: 500px;
    max-height: 80vh; 
    background: white;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
    flex-direction: column;
    z-index: 9999;
    font-family: Arial, sans-serif;
    border: 1px solid #e5e7eb;
    overflow: hidden;
  }

  .chat-header {
    background: #426EAC; 
    color: white;
    padding: 15px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .close-btn { cursor: pointer; font-size: 1.2rem; opacity: 0.8; }

  .chat-messages {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f9f9f9;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .message { padding: 10px 14px; border-radius: 15px; max-width: 85%; line-height: 1.4; font-size: 14px; }
  .user { background: #426EAC; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
  .bot { background: #e0e0e0; color: #1f2937; align-self: flex-start; border-bottom-left-radius: 2px; }

  .chat-input-area {
    display: flex;
    border-top: 1px solid #ddd;
    padding: 12px;
    background: white;
  }
  #userInput { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
  button.send { margin-left: 10px; padding: 10px 20px; background: #426EAC; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

  <h1>Clarety Core AI</h1>
  <p>This is a test page.</p>

  <button class="chat-btn" onclick="toggleChat()">💬</button>

  <div class="chat-window" id="chatWindow">
    <div class="chat-header">
      <span>Clarety Helper</span>
      <span class="close-btn" onclick="toggleChat()">✕</span>
    </div>
    <div class="chat-messages" id="messages">
      <div class="message bot">Hello! Ask me anything about our community.</div>
    </div>
    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="Type a question..." onkeypress="handleEnter(event)">
      <button class="send" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    // Ensure this matches your Render URL exactly
    const BACKEND_URL = "https://claretycoreapi.onrender.com/chat"; 

    // Counter to ensure every message has a unique ID
    let msgCounter = 0;

    function toggleChat() {
      const window = document.getElementById('chatWindow');
      if (window.style.display === 'flex') {
        window.style.display = 'none';
      } else {
        window.style.display = 'flex';
        setTimeout(() => document.getElementById('userInput').focus(), 100);
      }
    }

    function handleEnter(e) {
      if (e.key === 'Enter') sendMessage();
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      input.value = '';

      const loadingId = addMessage("Thinking...", 'bot');

      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: text })
        });

        if (!response.ok) throw new Error("Network error");

        const data = await response.json();
        const botMsgDiv = document.getElementById(loadingId);
        
        if (botMsgDiv) {
            // Convert newlines to breaks for cleaner list display
            botMsgDiv.innerHTML = data.answer.replace(/\n/g, "<br>");
            
            if(data.links && data.links.length > 0) {
              const linkList = document.createElement('div');
              linkList.style.marginTop = "10px";
              linkList.style.fontSize = "12px";
              linkList.innerHTML = "<b>Sources:</b><br>";
              data.links.forEach(l => {
                  const a = document.createElement('a');
                  a.href = l.url;
                  a.target = "_blank";
                  a.innerText = l.title;
                  a.style.display = "block";
                  a.style.color = "#426EAC";
                  a.style.marginTop = "4px";
                  linkList.appendChild(a);
              });
              botMsgDiv.appendChild(linkList);
            }
        }

      } catch (error) {
        console.error(error);
        const botMsgDiv = document.getElementById(loadingId);
        if (botMsgDiv) botMsgDiv.innerText = "I'm having trouble reaching the server. Please try again.";
      }
    }

    function addMessage(text, sender) {
      msgCounter++; 
      const msgs = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = `message ${sender}`;
      div.innerText = text;
      div.id = `msg-${msgCounter}`; // Unique ID
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
      return div.id;
    }
  </script>

</body>
</html>
