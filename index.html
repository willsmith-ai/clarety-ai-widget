<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarety Core AI</title>
  <style>
    :root{
      --clarety-green:#81A638;
      --clarety-blue:#426EAC;
      --bg:#ffffff;
    }
    body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#fff; }

    /* ===== Widget ===== */
    #clarety-chat {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #clarety-launcher {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid var(--clarety-green);
      background: #fff;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(0,0,0,.22);
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 0;
    }
    #clarety-launcher img {
      width: 92%;
      height: 92%;
      object-fit: contain;
      display:block;
    }

    #clarety-panel {
      display: none;
      width: 360px;
      height: 560px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      position: absolute;
      bottom: 70px;
      right: 0;
      overflow: hidden;
      flex-direction: column;
    }
    #clarety-panel.open { display:flex; }

    #clarety-header {
      background: var(--clarety-blue);
      color: #fff;
      padding: 14px;
      display:flex;
      justify-content: space-between;
      align-items:center;
      font-weight: 900;
      letter-spacing: 0.2px;
    }
    #clarety-close {
      border: 0;
      background: rgba(255,255,255,0.2);
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 20px;
      line-height: 36px;
    }

    #messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      background: #fff;
    }

    .message {
      max-width: 85%;
      padding: 12px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .message.user { background: var(--clarety-blue); color:#fff; margin-left:auto; }
    .message.bot  { background:#e9ecef; color:#111; }

    .chat-input-area {
      border-top: 1px solid #eee;
      background:#fff;
      padding: 10px;
      display:flex;
      flex-direction: column;
      gap: 8px;
    }

    .row {
      display:flex;
      gap: 8px;
      align-items:center;
    }

    .chat-input-area input[type="text"] {
      flex:1;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid #ddd;
      outline:none;
      font-size: 14px;
    }

    .btn {
      border: 0;
      cursor: pointer;
      border-radius: 14px;
      height: 40px;
      padding: 0 14px;
      font-weight: 900;
      font-size: 14px;
    }
    #sendBtn { background: var(--clarety-green); color:#fff; }
    #clipBtn { background:#f2f2f2; color:#111; width: 44px; padding:0; display:grid; place-items:center; }
    #clipBtn:hover { background:#e8e8e8; }

    #previewWrap {
      display:none;
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 8px;
      gap: 10px;
      align-items:center;
    }
    #previewWrap.show { display:flex; }
    #previewImg {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      object-fit: cover;
      background:#fafafa;
    }
    #removeImgBtn {
      margin-left:auto;
      background:#fff;
      border: 1px solid #ddd;
      border-radius: 12px;
      height: 32px;
      padding: 0 10px;
      cursor:pointer;
      font-weight:800;
    }
  </style>
</head>
<body>

  <!-- Widget -->
  <div id="clarety-chat">
    <button id="clarety-launcher" aria-label="Open Clarety Assistant" type="button">
      <img src="assets/ClaretyAIimage.png" alt="Clarety" />
    </button>

    <div id="clarety-panel" role="dialog" aria-label="Clarety Assistant">
      <div id="clarety-header">
        Clarety Assistant
        <button id="clarety-close" aria-label="Close chat" type="button">×</button>
      </div>

      <div id="messages">
        <div class="message bot">Hi 👋 Upload a screenshot or image, or ask me to draft an email/appeal.</div>
      </div>

      <div class="chat-input-area">
        <!-- Image preview -->
        <div id="previewWrap">
          <img id="previewImg" alt="Preview" />
          <div style="font-size:13px; color:#334155;">
            <div style="font-weight:900;">Image attached</div>
            <div id="previewName" style="opacity:.8;"></div>
          </div>
          <button id="removeImgBtn" type="button">Remove</button>
        </div>

        <!-- Controls -->
        <div class="row">
          <button id="clipBtn" class="btn" type="button" title="Attach image">📎</button>
          <input id="userInput" type="text" placeholder="Type a message…" autocomplete="off" />
          <button id="sendBtn" class="btn" type="button">Send</button>
        </div>

        <!-- Hidden file input -->
        <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" style="display:none" />
      </div>
    </div>
  </div>

<script>
  const API_URL = "https://claretycoreapi.onrender.com/chat";
  let isProcessing = false;

  // Stable session id for memory
  const SESSION_KEY = "clarety_chat_session_id";
  function getSessionId() {
    let id = localStorage.getItem(SESSION_KEY);
    if (!id) {
      id = "sess_" + Math.random().toString(16).slice(2) + Date.now().toString(16);
      localStorage.setItem(SESSION_KEY, id);
    }
    return id;
  }

  const panel = document.getElementById("clarety-panel");
  const launcher = document.getElementById("clarety-launcher");
  const closeBtn = document.getElementById("clarety-close");
  const sendBtn = document.getElementById("sendBtn");
  const inputField = document.getElementById("userInput");

  const clipBtn = document.getElementById("clipBtn");
  const fileInput = document.getElementById("fileInput");
  const previewWrap = document.getElementById("previewWrap");
  const previewImg = document.getElementById("previewImg");
  const previewName = document.getElementById("previewName");
  const removeImgBtn = document.getElementById("removeImgBtn");

  let attachedFile = null;

  launcher.onclick = () => panel.classList.toggle("open");
  closeBtn.onclick = () => panel.classList.remove("open");
  sendBtn.onclick = sendMessage;
  inputField.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

  clipBtn.onclick = () => fileInput.click();

  fileInput.onchange = () => {
    const f = fileInput.files && fileInput.files[0];
    if (!f) return;
    attachedFile = f;

    previewName.textContent = f.name;
    previewImg.src = URL.createObjectURL(f);
    previewWrap.classList.add("show");
  };

  removeImgBtn.onclick = () => {
    attachedFile = null;
    fileInput.value = "";
    previewImg.src = "";
    previewName.textContent = "";
    previewWrap.classList.remove("show");
  };

  function addMessage(text, sender) {
    const messagesDiv = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `message ${sender}`;
    div.innerText = text;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return div;
  }

  async function sendMessage(){
    if (isProcessing) return;

    const message = inputField.value.trim();
    if (!message && !attachedFile) return;

    panel.classList.add("open");
    if (message) addMessage(message, "user");
    else addMessage("[Image uploaded]", "user");

    inputField.value = "";
    isProcessing = true;
    const thinkingEl = addMessage("Thinking…", "bot");

    try {
      const sessionId = getSessionId();

      let response;

      if (attachedFile) {
        // multipart upload
        const fd = new FormData();
        fd.append("query", message || "");
        fd.append("sessionId", sessionId);
        fd.append("image", attachedFile);

        response = await fetch(API_URL, {
          method: "POST",
          body: fd
        });

        // clear attachment after sending
        removeImgBtn.click();
      } else {
        // plain JSON
        response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: message, sessionId })
        });
      }

      const dataText = await response.text();
      if (!response.ok) throw new Error(dataText);

      const data = JSON.parse(dataText);
      thinkingEl.remove();
      addMessage(data.answer || "Okay.", "bot");

    } catch (e) {
      thinkingEl.innerText = "Sorry — I couldn’t connect or process that. Try again.";
      console.error(e);
    } finally {
      isProcessing = false;
    }
  }
</script>

</body>
</html>
