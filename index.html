<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarety Core AI</title>
    <style>
        /* This makes the page look nice and centers the chat */
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        /* Widget Styling */
        .chat-container { width: 400px; height: 600px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background-color: #007bff; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 18px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        /* Message Bubbles */
        .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.4; }
        .message.user { background-color: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.bot { background-color: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        
        /* Input Area */
        .chat-input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        
        /* Document Links */
        .doc-link { display: block; margin-top: 5px; color: #007bff; text-decoration: none; font-size: 12px; }
        .doc-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Clarety Core AI</div>
    <div class="chat-messages" id="messages">
        <div class="message bot">Hello! I am connected to the Clarety Knowledge Database. Ask me anything.</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Type your question..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    // ✅ THIS IS CONNECTED TO YOUR RENDER BACKEND
    const API_URL = "https://claretycoreapi.onrender.com/chat";

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const message = inputField.value.trim();
        if (!message) return;

        // 1. Show User Message
        addMessage(message, "user");
        inputField.value = "";

        // 2. Show Loading...
        const loadingId = addMessage("Searching...", "bot");

        try {
            // 3. Send to Backend
            const response = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ query: message })
            });
            
            const data = await response.json();
            
            // 4. Remove Loading and Show Answer
            document.getElementById(loadingId).remove();
            addMessage(data.answer, "bot");

            // 5. Add Clickable Document Links
            if (data.links && data.links.length > 0) {
                const messagesDiv = document.getElementById("messages");
                const lastMsg = messagesDiv.lastElementChild;
                data.links.forEach(link => {
                    const a = document.createElement("a");
                    a.href = link.url;
                    a.target = "_blank";
                    a.className = "doc-link";
                    a.innerText = "📄 " + link.title;
                    lastMsg.appendChild(a);
                });
            }

        } catch (error) {
            console.error("Error:", error);
            document.getElementById(loadingId).innerText = "Sorry, I couldn't connect to the server.";
        }
    }

    function addMessage(text, sender) {
        const messagesDiv = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = `message ${sender}`;
        div.id = "msg-" + Date.now();
        div.innerText = text;
        messagesDiv.appendChild(div);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
        return div.id;
    }

    function handleEnter(e) {
        if (e.key === "Enter") sendMessage();
    }
</script>

</body>
</html>
