<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clarety Core AI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 400px; height: 600px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background-color: #007bff; color: white; padding: 20px; text-align: center; font-weight: bold; font-size: 18px; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 15px; border-radius: 15px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .message.user { background-color: #007bff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .message.bot { background-color: #e9ecef; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 20px; border-top: 1px solid #eee; display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .doc-link { display: block; margin-top: 8px; color: #007bff; text-decoration: none; font-size: 13px; background: rgba(0,123,255,0.1); padding: 5px 10px; border-radius: 5px; }
        .doc-link:hover { background: rgba(0,123,255,0.2); }
    </style>
</head>
<body>
<div id="clarety-chat">
  <button id="clarety-launcher">💬</button>

  <div id="clarety-panel">
    <div id="clarety-header">
      <strong>Clarety Assistant</strong>
      <button id="clarety-close">✕</button>
    </div>

    <div id="messages">
      <div class="message bot">
        Hi 👋 I’m the Clarety Assistant. How can I help today?
      </div>
    </div>

    <div class="chat-input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Type a message…"
        onkeypress="if(event.key === 'Enter') sendMessage()"
      />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>
</div>

<style>
#clarety-chat {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

#clarety-launcher {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: none;
  background: #81A638;
  color: white;
  font-size: 24px;
  cursor: pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,.25);
}

#clarety-panel {
  display: none;
  width: 360px;
  height: 520px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0,0,0,.25);
  position: absolute;
  bottom: 70px;
  right: 0;
  overflow: hidden;
  flex-direction: column;
}

#clarety-panel.open {
  display: flex;
}

#clarety-header {
  background: #426EAC;
  color: white;
  padding: 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

#messages {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
}

.message {
  max-width: 80%;
  padding: 10px 14px;
  border-radius: 14px;
  margin-bottom: 10px;
  font-size: 14px;
}

.message.user {
  background: #426EAC;
  color: white;
  margin-left: auto;
}

.message.bot {
  background: #e9ecef;
}

.chat-input-area {
  padding: 12px;
  border-top: 1px solid #eee;
  display: flex;
  gap: 8px;
}

.chat-input-area input {
  flex: 1;
  padding: 10px;
  border-radius: 18px;
  border: 1px solid #ddd;
}

.chat-input-area button {
  background: #81A638;
  color: white;
  border: none;
  padding: 0 16px;
  border-radius: 18px;
  cursor: pointer;
}

.doc-link {
  display: block;
  margin-top: 6px;
  font-size: 13px;
  color: #426EAC;
}
</style>

<script>
const API_URL = "https://claretycoreapi.onrender.com/chat";
let isProcessing = false;

const launcher = document.getElementById("clarety-launcher");
const panel = document.getElementById("clarety-panel");
const closeBtn = document.getElementById("clarety-close");

launcher.onclick = () => panel.classList.toggle("open");
closeBtn.onclick = () => panel.classList.remove("open");

async function sendMessage() {
  if (isProcessing) return;

  const inputField = document.getElementById("userInput");
  const message = inputField.value.trim();
  if (!message) return;

  isProcessing = true;
  addMessage(message, "user");
  inputField.value = "";

  const loadingId = addMessage("Thinking…", "bot");

  try {
    const response = await fetch("https://claretycoreapi.onrender.com", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: message })
    });

    const data = await response.json();

    document.getElementById(loadingId)?.remove();
    addMessage(data.answer, "bot");

    if (data.links) {
      const lastMsg = document.getElementById("messages").lastElementChild;
      data.links.forEach(link => {
        const a = document.createElement("a");
        a.href = link.url;
        a.target = "_blank";
        a.className = "doc-link";
        a.innerText = "📄 " + link.title;
        lastMsg.appendChild(a);
      });
    }

  } catch {
    document.getElementById(loadingId).innerText = "Sorry — something went wrong.";
  } finally {
    isProcessing = false;
  }
}

function addMessage(text, sender) {
  const messagesDiv = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `message ${sender}`;
  div.id = "msg-" + Date.now();
  div.innerText = text;
  messagesDiv.appendChild(div);
  messagesDiv.scrollTop = messagesDiv.scrollHeight;
  return div.id;
}
</script>
</body>
</html>
