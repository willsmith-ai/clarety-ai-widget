<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clarety Core AI</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f4f9;
      margin: 0;
    }

    /* ================= Clarety Popup Widget ================= */
    #clarety-chat {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
    }

    /* Launcher bubble */
    #clarety-launcher {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 3px solid #81A638;
      background: #ffffff;
      cursor: pointer;
      box-shadow:
        0 10px 22px rgba(0,0,0,.22),
        0 0 0 6px rgba(129,166,56,.15);
      display: grid;
      place-items: center;
      padding: 0;
      overflow: hidden;
    }

    #clarety-launcher img {
      width: 92%;
      height: 92%;
      object-fit: contain;
      display: block;
    }

    #clarety-panel {
      display: none;
      width: 360px;
      height: 520px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.25);
      position: absolute;
      bottom: 70px;
      right: 0;
      overflow: hidden;
      flex-direction: column;
    }

    #clarety-panel.open {
      display: flex;
    }

    #clarety-header {
      background: #426EAC;
      color: white;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #clarety-header strong {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.2px;
    }

    #clarety-close {
      border: 0;
      background: rgba(255,255,255,0.2);
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 22px;
      line-height: 40px;
    }

    #messages {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      background: #fff;
    }

    .message {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 14px;
      margin-bottom: 10px;
      font-size: 14px;
      line-height: 1.35;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user {
      background: #426EAC;
      color: white;
      margin-left: auto;
    }

    .message.bot {
      background: #e9ecef;
      color: #111;
    }

    .chat-input-area {
      padding: 12px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
      background: #fff;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 18px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 14px;
    }

    .chat-input-area button {
      background: #81A638;
      color: white;
      border: none;
      padding: 0 18px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 800;
      font-size: 14px;
    }

    /* Sources UI (only shown when user asks) */
    .source-toggle {
      margin-top: 6px;
      font-size: 13px;
      color: #426EAC;
      cursor: pointer;
      user-select: none;
    }

    .sources {
      margin-top: 6px;
      display: none;
    }

    .sources.open {
      display: block;
    }

    .doc-link {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      color: #426EAC;
      text-decoration: none;
      background: rgba(66,110,172,0.12);
      padding: 8px 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<div id="clarety-chat">
  <button id="clarety-launcher" aria-label="Open Clarety Assistant" type="button">
    <img src="assets/ClaretyAIimage.png" alt="Clarety" />
  </button>

  <div id="clarety-panel" role="dialog" aria-label="Clarety Assistant">
    <div id="clarety-header">
      <strong>Clarety Assistant</strong>
      <button id="clarety-close" aria-label="Close chat" type="button">×</button>
    </div>

    <div id="messages">
      <div class="message bot">
        Hi 👋 I’m the Clarety Assistant.
        Ask a Clarety question, or say “draft an email…” and I’ll help.
      </div>
    </div>

    <div class="chat-input-area">
      <input id="userInput" type="text" placeholder="Type a message…" autocomplete="off" />
      <button id="sendBtn" type="button">Send</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://claretycoreapi.onrender.com/chat";
  let isProcessing = false;

  const launcher = document.getElementById("clarety-launcher");
  const panel = document.getElementById("clarety-panel");
  const closeBtn = document.getElementById("clarety-close");
  const sendBtn = document.getElementById("sendBtn");
  const inputField = document.getElementById("userInput");

  launcher.onclick = () => panel.classList.toggle("open");
  closeBtn.onclick = () => panel.classList.remove("open");
  sendBtn.onclick = sendMessage;
  inputField.addEventListener("keypress", e => { if (e.key === "Enter") sendMessage(); });

  // ----------------- LOCAL “NATURAL” RESPONSES -----------------
  function norm(text) {
    return text.trim().toLowerCase().replace(/\s+/g, " ");
  }

  function isGreeting(text) {
    const t = norm(text);
    return [
      "hi","hello","hey","hiya","yo","sup",
      "good morning","good afternoon","good evening"
    ].includes(t);
  }

  function isHowAreYou(text) {
    const t = norm(text);
    return (
      t === "how are you" ||
      t === "how are you?" ||
      t === "how's it going" ||
      t === "hows it going" ||
      t === "how are things" ||
      t === "how are things?" ||
      t === "how you going" ||
      t === "how you going?"
    );
  }

  function isThanks(text) {
    const t = norm(text);
    return (
      t === "thanks" || t === "thank you" || t === "ty" ||
      t === "thanks!" || t === "thank you!" || t === "thx"
    );
  }

  function isTest(text) {
    return norm(text) === "test";
  }

  function localReply(text) {
    if (isHowAreYou(text)) {
      return "I’m doing well — thanks for asking 😊\n\nHow can I help today? You can:\n• ask a Clarety question\n• ask me to draft/rewrite an email\n• describe a situation and I’ll suggest next steps";
    }
    if (isGreeting(text)) {
      return "Hi 👋 How can I help today?\n\nTry: “Draft an email to supporters about…” or “How do I… in Clarety?”";
    }
    if (isThanks(text)) {
      return "You’re welcome 😊 Anything else you’d like help with?";
    }
    if (isTest(text)) {
      return "✅ I’m here and working.\n\nAsk a question or say “draft an email…”";
    }
    return null;
  }

  // Only show sources if the user explicitly asks
  function userWantsSources(text) {
    const t = norm(text);
    const keywords = [
      "sources", "source", "links", "link", "docs", "documents", "document",
      "where did you get that", "show sources", "show links", "show docs", "citations", "cite"
    ];
    return keywords.some(k => t.includes(k));
  }

  // ----------------- MAIN SEND -----------------
  async function sendMessage() {
    if (isProcessing) return;

    const message = inputField.value.trim();
    if (!message) return;

    panel.classList.add("open");
    addMessage(message, "user");
    inputField.value = "";

    // 1) Handle small talk locally (NO backend call, NO "Thinking…", NO doc links)
    const quick = localReply(message);
    if (quick) {
      addMessage(quick, "bot");
      return;
    }

    // 2) Otherwise call backend
    isProcessing = true;
    const loadingId = addMessage("Thinking…", "bot");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        mode: "cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ query: message })
      });

      const raw = await res.text();
      if (!res.ok) throw new Error(`HTTP ${res.status}: ${raw}`);

      const data = JSON.parse(raw);

      // Remove "Thinking…"
      document.getElementById(loadingId)?.remove();

      // Show answer
      const botMsgId = addMessage(data.answer || "No answer returned.", "bot");
      const botMsgEl = document.getElementById(botMsgId);

      // 3) Show sources ONLY if user asked
      if (userWantsSources(message) && data.links && data.links.length > 0) {
        const toggle = document.createElement("div");
        toggle.className = "source-toggle";
        toggle.innerText = `View sources (${data.links.length})`;

        const sources = document.createElement("div");
        sources.className = "sources";

        data.links.forEach(link => {
          const a = document.createElement("a");
          a.href = link.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.className = "doc-link";
          a.innerText = "📄 " + link.title;
          sources.appendChild(a);
        });

        toggle.onclick = () => sources.classList.toggle("open");
        botMsgEl.appendChild(toggle);
        botMsgEl.appendChild(sources);
      }

    } catch (err) {
      console.error(err);
      const loadingMsg = document.getElementById(loadingId);
      if (loadingMsg) loadingMsg.innerText = "Sorry — I couldn’t reach the server. Please try again.";
    } finally {
      isProcessing = false;
    }
  }

  function addMessage(text, sender) {
    const messagesDiv = document.getElementById("messages");
    const div = document.createElement("div");
    div.className = `message ${sender}`;
    div.id = "msg-" + Date.now();
    div.innerText = text;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return div.id;
  }
</script>

</body>
</html>
